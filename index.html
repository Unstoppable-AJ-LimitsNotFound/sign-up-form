<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-Up Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <section class="sidebar">

        <div class="behind-logo">
          <span class="logo"></span>
          <span class="logo-text">Odin</span>
        </div>

        <span id="credit">Photo by <a href="https://unsplash.com/@haliewestphoto?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Halie West</a> on <a href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a></span>
      </section>

      <main>
        <p>
          This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. <br>
          Sign up <em>now</em> to get started. 
        </p>

        <p>
          You <em>know</em> you want to.
        </p>

        <form action="#">
          <p>Lets do this!</p>

          <label for="fname">FIRST NAME</label>
          <input type="text" name="first-name" id="fname">
          
          <label for="lname">LAST NAME</label>
          <input type="text" name="last-name" id="lname">

          <label for="mail">EMAIL</label>
          <input type="email" name="email" id="mail">

          <label for="phone">PHONE NUMBER</label>
          <input type="tel" name="phone-number" id="phone">

          <label for="p1">PASSWORD</label>
          <input type="password" name="pass1" id="p1">

          <label for="p2">CONFIRM PASSWORD</label>
          <input type="password" name="pass2" id="p2">
        </form>

        <button>Create Account</button>

        <p>
          Already have an account? <a href="#">Log in</a>
        </p>
      </main>
    </div>
  </body>
</html>
